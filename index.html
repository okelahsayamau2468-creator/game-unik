<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tebak Nama Hewan - Game Edukasi</title>
  <link rel="stylesheet" href="style.css">
  <!-- Font Google untuk tampilan lebih menarik -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>

  <!-- SCREEN 1: HOME MENU -->
  <div id="home-screen" class="card fade-in">
    <div class="logo-icon">🦁</div>
    <h1>Tebak Hewan!</h1>
    <p class="subtitle">Uji pengetahuanmu tentang dunia satwa</p>

    <div class="menu-options">
      <button class="btn-primary" onclick="startGame()">▶️ Mulai Bermain</button>
      <button class="btn-secondary" onclick="toggleInfo()">ℹ️ Cara Bermain</button>
    </div>

    <!-- Info Popup -->
    <div id="info-box" class="info-box hidden">
      <p>Pilih nama hewan yang sesuai dengan gambar. Setiap tebakan akan memberikan suara petunjuk!</p>
    </div>
  </div>

  <!-- SCREEN 2: GAME AREA -->
  <div id="game-screen" class="card hidden">
    <div class="game-header">
      <button class="btn-back" onclick="goToHome()">🏠 Menu</button>
      <span id="score-display">Skor: 0</span>
    </div>

    <div class="image-container">
      <img id="animal-img" src="" alt="Gambar Hewan">
    </div>

    <div class="options-grid" id="options-container"></div>

    <div id="message" class="message"></div>

    <button id="btn-next" class="btn-next hidden" onclick="loadQuestion()">Soal Berikutnya ➔</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
