<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Game Matematika Seru!</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <h1>🎮 Game Matematika</h1>
        <div id="question" class="question">Berapa 2 + 2?</div>
        <input type="number" id="answer" placeholder="Jawabanmu..." autofocus>
        <button onclick="checkAnswer()">Jawab!</button>
        <p id="result"></p>
        <p>Skor: <span id="score">0</span></p>
    </div>
    <script src="script.js"></script>
</body>
</html>
